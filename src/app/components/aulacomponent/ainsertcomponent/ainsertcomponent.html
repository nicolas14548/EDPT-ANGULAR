<div class="container">
  <div>
    <h2>Registro de Aula</h2>
  </div>
  <div>
    <form [formGroup]="aulaForm" (ngSubmit)="insertarAula()">
      <mat-form-field class="example-full-width">
        <mat-label>ID del Colegio</mat-label>
        <input matInput type="number" formControlName="idColegio">
      </mat-form-field>
      <br>
      <mat-form-field class="example-full-width">
        <mat-label>Grado</mat-label>
        <input matInput placeholder="Primero" formControlName="grado">
      </mat-form-field>
      <br>
      <mat-form-field class="example-full-width">
        <mat-label>Sección</mat-label>
        <input matInput placeholder="A" formControlName="seccion">
      </mat-form-field>
      <br>
      <section class="example-section">
        <mat-checkbox class="example-margin" formControlName="estado">Activo</mat-checkbox>
      </section>

      <button matButton type="submit">Registrar</button>

    </form>
  </div>
</div>
